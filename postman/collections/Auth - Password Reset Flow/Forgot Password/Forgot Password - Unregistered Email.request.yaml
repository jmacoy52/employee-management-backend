$kind: http-request
name: Forgot Password - Unregistered Email
method: POST
url: 'http://localhost:5000/api/users/forgot-password'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "nonexistent@example.com"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Returns vague message to prevent email enumeration", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("message");
          pm.expect(json.message).to.equal("If user exists, reset link sent");
      });

      pm.test("Response does not expose whether user exists", function () {
          const json = pm.response.json();
          pm.expect(json).to.not.have.property("error");
          pm.expect(json).to.not.have.property("token");
          pm.expect(json).to.not.have.property("resetToken");
      });
