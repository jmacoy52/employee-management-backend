$kind: http-request
name: Forgot Password - Missing Email
method: POST
url: 'http://localhost:5000/api/users/forgot-password'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 400 when email is missing", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Returns error message for missing email", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("error");
          pm.expect(json.error).to.equal("Email required");
      });
