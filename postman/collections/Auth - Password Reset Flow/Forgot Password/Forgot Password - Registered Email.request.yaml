$kind: http-request
name: Forgot Password - Registered Email
method: POST
url: 'http://localhost:5000/api/users/forgot-password'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{registeredEmail}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Returns success message for registered user", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("message");
          pm.expect(json.message).to.be.a("string").and.to.have.length.above(0);
      });

      pm.test("Response does not expose the reset token in body", function () {
          const json = pm.response.json();
          pm.expect(json).to.not.have.property("token");
          pm.expect(json).to.not.have.property("resetToken");
      });
