$kind: http-request
name: Reset Password - Invalid Token
method: POST
url: 'http://localhost:5000/api/users/reset-password'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "token": "this.is.an.invalid.token",
      "newPassword": "NewPass@123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 400 for invalid token", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Returns error for invalid token", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("error");
          pm.expect(json.error).to.equal("Invalid token");
      });
