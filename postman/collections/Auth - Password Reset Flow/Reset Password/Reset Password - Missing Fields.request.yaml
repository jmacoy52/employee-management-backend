$kind: http-request
name: Reset Password - Missing Fields
method: POST
url: 'http://localhost:5000/api/users/reset-password'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "token": ""
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 400 when fields are missing", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Returns error for missing token or password", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("error");
          pm.expect(json.error).to.equal("Token and new password required");
      });
