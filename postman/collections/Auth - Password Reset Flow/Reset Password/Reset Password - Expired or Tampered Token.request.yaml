$kind: http-request
name: Reset Password - Expired or Tampered Token
method: POST
url: 'http://localhost:5000/api/users/reset-password'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjk5OTksImVtYWlsIjoiZmFrZUBleGFtcGxlLmNvbSIsImlhdCI6MTYwMDAwMDAwMCwiZXhwIjoxNjAwMDAwMDAxfQ.invalidsignature",
      "newPassword": "NewPass@123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 400 for expired/tampered token", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Returns invalid token error", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("error");
          pm.expect(json.error).to.equal("Invalid token");
      });
