# Render blueprint for the EmploCore API (documents the dashboard settings; no secret values here).
services:
  - type: web
    name: employee-management-system-backend
    runtime: node
    branch: v1/aiven-production
    buildCommand: npm install && npm run db:init   # schema + migrations; demo data only if SEED_DEMO=true
    startCommand: node server.js
    healthCheckPath: /api/live
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DB_URL
        sync: false
      - key: DB_SSL_CA_BASE64
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: ALLOWED_ORIGINS
        value: https://emplocore.vercel.app,https://emplocore-*.vercel.app
      - key: SEED_DEMO
        value: "false"
      # This service is the public portfolio demo; set "false" for a real deployment (docs/PRODUCTION.md)
      - key: DEMO_MODE
        value: "true"
      # Subscriptions (docs/PAYSTACK_SETUP.md). Leave the Paystack keys unset until you are ready: the billing page
      # then shows "Payments coming soon" and nothing else changes.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: APP_URL
        value: https://emplocore.vercel.app
      - key: BILLING_IN_APP_DAILY
        value: "true"

  # OPTIONAL daily billing cron. Not needed: the web service runs the daily billing job itself once a day
  # (services/billingScheduler.js, from 06:00 UTC, DB-locked and idempotent). Uncomment this block only if you
  # want a separate Render cron service (at least US$1/month); both together are still safe.
  # Then set BILLING_IN_APP_DAILY=false on the web service if you want only the cron to run it.
  # Daily billing job: trial and renewal reminders, trial expiry, grace periods, downgrades to Free and
  # reconciliation with Paystack. Runs at 06:00 UTC (06:00 in Accra). Safe to run twice (named lock + conditional
  # updates). Uses the same database as the web service; migrations are applied by the web service's build.
  # - type: cron
  #   name: emplocore-billing-daily
  #   runtime: node
  #   branch: v1/aiven-production
  #   schedule: "0 6 * * *"
  #   buildCommand: npm install
  #   startCommand: npm run billing:daily
  #   envVars:
  #     - key: NODE_VERSION
  #       value: "20"
  #     - key: DB_URL
  #       sync: false
  #     - key: DB_SSL_CA_BASE64
  #       sync: false
  #     - key: PAYSTACK_SECRET_KEY
  #       sync: false
